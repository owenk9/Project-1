<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Xác nhận xóa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .delete-form-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #d9534f;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            margin: 10px 0;
            color: #555;
        }

        .btn {
            display: inline-block;
            font-size: 16px;
            padding: 10px 20px;
            margin: 10px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .btn-danger {
            background-color: #d9534f;
        }

        .btn-danger:hover {
            background-color: #c9302c;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
<div class="delete-form-container">
    <h2>Xóa sản phẩm</h2>
    <p>Bạn có chắc chắn muốn xóa sản phẩm này?</p>

    <form th:action="@{/admin/deleteProducts}" method="post">
        <input type="hidden" name="productId" th:value="${deleteProduct.productId}" />
        <p><strong>Tên sản phẩm:</strong> <span th:text="${deleteProduct.productName}"></span></p>
        <p><strong>Giá:</strong> <span th:text="${deleteProduct.price}"></span></p>
        <button type="submit" class="btn btn-danger">Xóa</button>
        <a th:href="@{/admin/tables}" class="btn btn-secondary">Hủy</a>
    </form>
</div>
</body>
</html>
